apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opentelemetry
  namespace: flux-system
spec:
  interval: 10m
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.123.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-contrib
      # Disable the operator's self-managed NetworkPolicy. When on, the operator
      # writes an egress policy for its own pod that hardcodes the current API
      # server IP. AKS rotates that IP on cluster stop/start, which locks the
      # operator out of the API and causes CrashLoopBackOff (it then wrongly
      # reports "OpenTelemetryCollector CRDs are not present"). Leaving this off
      # keeps the operator reachable across control-plane IP rotations.
      featureGatesMap:
        operator.networkpolicy: false
