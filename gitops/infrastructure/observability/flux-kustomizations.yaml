apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./gitops/infrastructure/observability/operator
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: otel-operator
  path: ./gitops/infrastructure/observability/config
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
