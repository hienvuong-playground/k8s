# Step 1 of network segmentation for the observability namespace.
#
# grafana-egress:     default-deny egress on Grafana, allowing only DNS and
#                     queries to the Prometheus datasource.
# prometheus-ingress: default-deny ingress on Prometheus, allowing only Grafana
#                     (datasource queries) and the OTEL Collector (remote-write).
#
# NOTE: Grafana reaches Prometheus via the Service on port 80, but Cilium
# enforces on the destination *pod* port, which is 9090 (the prometheus-server
# container port). All toPorts below use 9090.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-egress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    # DNS resolution (CoreDNS) — required to resolve prometheus-server.svc
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Prometheus datasource queries
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    # Grafana datasource queries
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # OTEL Collector remote-write (/api/v1/write)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: otel-collector
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
