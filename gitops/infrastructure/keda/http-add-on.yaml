apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: keda
  storageNamespace: keda
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    createNamespace: false
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    interceptor:
      replicas:
        min: 2
