apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: keda
  storageNamespace: keda
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    createNamespace: false
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Trimmed requests + single interceptor so the HTTP add-on fits alongside
    # keda-core on the single node. Scheduling keys on requests, not limits.
    interceptor:
      replicas:
        min: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    scaler:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
    operator:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
